<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#090f1d" />
    <title>Página não encontrada | Sérvulo Sousa</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; background: #090f1d; color: #edf2fc; }
      main { width: min(100%, 720px); padding: clamp(2rem, 7vw, 4rem); border: 1px solid #26334d; border-radius: 1.25rem; background: #10182b; }
      p:first-child { margin: 0 0 1rem; color: #8eace8; font-size: .75rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2.5rem, 10vw, 5rem); line-height: .95; letter-spacing: -.055em; }
      p { color: #b5c0d5; line-height: 1.7; }
      a { display: inline-flex; margin-top: .75rem; padding: .85rem 1.1rem; border-radius: .75rem; background: #edf2fc; color: #10182b; font-weight: 800; text-decoration: none; }
      a:focus-visible { outline: 3px solid #8eace8; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <p>Erro 404</p>
      <h1>Página não encontrada.</h1>
      <p>O endereço acessado não existe ou foi alterado. Você pode voltar para a página inicial do portfólio.</p>
      <a href="/">Voltar ao portfólio</a>
    </main>
  </body>
</html>
